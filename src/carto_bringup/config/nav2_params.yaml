amcl:
  ros__parameters:
    use_sim_time: false

    # FIX: your rover is a 3-wheel omni base (DWB below allows Y strafing),
    # but AMCL was left on the differential-drive motion model, which
    # doesn't model lateral slip -> particle cloud smears on any sideways move.
    robot_model_type: "nav2_amcl::OmniMotionModel"

    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2

    base_frame_id: "base_link"
    odom_frame_id: "odom"
    global_frame_id: "map"

    scan_topic: "/scan"

    laser_model_type: "likelihood_field"
    laser_min_range: 0.15
    laser_max_range: 12.0
    laser_max_beams: 60

    min_particles: 500
    max_particles: 2000

    update_min_d: 0.20
    update_min_a: 0.20

    resample_interval: 1

    transform_tolerance: 1.0

    # FIX: was false with no pose given, so map->odom TF never publishes
    # until you manually click "2D Pose Estimate" in RViz2 -- that's why
    # everything under the map frame (costmaps, particle cloud, robot
    # model relative to map) looked dead/missing.
    # This assumes the rover always powers on at the map origin (0,0,0).
    # If that's not true for your setup, set this back to false and use
    # "2D Pose Estimate" each run instead.
    set_initial_pose: true
    initial_pose:
      x: 0.0
      y: 0.0
      z: 0.0
      yaw: 0.0

    tf_broadcast: true


map_server:
  ros__parameters:
    use_sim_time: false
    yaml_filename: ""


planner_server:
  ros__parameters:
    use_sim_time: false

    expected_planner_frequency: 10.0

    planner_plugins:
      - "GridBased"

    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.5
      use_astar: false
      allow_unknown: true


controller_server:
  ros__parameters:
    use_sim_time: false

    controller_frequency: 10.0

    odom_topic: "/odom"

    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001

    progress_checker_plugins:
      - "progress_checker"

    goal_checker_plugins:
      - "goal_checker"

    controller_plugins:
      - "FollowPath"

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.15
      movement_time_allowance: 10.0

    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      stateful: true
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.25

    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"

      debug_trajectory_details: false

      # =========================
      # Omni rover velocity limits
      # =========================

      min_vel_x: -0.5
      max_vel_x: 0.5

      min_vel_y: -0.5
      max_vel_y: 0.5

      min_vel_theta: -1.0
      max_vel_theta: 1.0

      min_speed_xy: 0.0
      max_speed_xy: 0.5

      min_speed_theta: 0.0
      max_speed_theta: 1.0

      # =========================
      # Acceleration
      # =========================

      acc_lim_x: 1.0
      acc_lim_y: 1.0
      acc_lim_theta: 2.0

      decel_lim_x: -1.0
      decel_lim_y: -1.0
      decel_lim_theta: -2.0

      # =========================
      # Trajectory sampling
      # =========================
      # FIX: 20x20x20 = 8000 trajectories scored per cycle at 10Hz is heavy
      # and can miss the control loop deadline, showing up in RViz2 as a
      # stuttering/lagging local plan line. Dropped to 10 each (1000 total).

      vx_samples: 10
      vy_samples: 10
      vtheta_samples: 10

      sim_time: 1.5

      linear_granularity: 0.05
      angular_granularity: 0.025

      # =========================
      # Goal
      # =========================

      xy_goal_tolerance: 0.25
      trans_stopped_velocity: 0.05

      # =========================
      # DWB
      # =========================

      short_circuit_trajectory_evaluation: true
      stateful: true

      critics:
        - "RotateToGoal"
        - "Oscillation"
        - "BaseObstacle"
        - "GoalAlign"
        - "PathAlign"
        - "PathDist"
        - "GoalDist"

bt_navigator:
  ros__parameters:
    use_sim_time: false

    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom

    default_nav_to_pose_bt_xml: "/opt/ros/humble/share/nav2_bt_navigator/behavior_trees/navigate_to_pose_w_replanning_and_recovery.xml"
    # FIX: bt_navigator hosts BOTH the navigate_to_pose and
    # navigate_through_poses action servers and validates both default
    # trees at activation -- not just the one you call. Since this wasn't
    # set, it fell back to the stock navigate_through_poses XML, which
    # uses BT node types (RemovePassedGoals, etc.) that weren't in
    # plugin_lib_names below, so bt_navigator failed to activate and
    # lifecycle_manager aborted the entire bringup.
    default_nav_through_poses_bt_xml: "/opt/ros/humble/share/nav2_bt_navigator/behavior_trees/navigate_through_poses_w_replanning_and_recovery.xml"

    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_compute_path_through_poses_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_back_up_action_bt_node
      - nav2_spin_action_bt_node
      - nav2_wait_action_bt_node
      - nav2_assisted_teleop_action_bt_node
      - nav2_drive_on_heading_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_is_stuck_condition_bt_node
      - nav2_goal_reached_condition_bt_node
      - nav2_goal_updated_condition_bt_node
      - nav2_globally_updated_goal_condition_bt_node
      - nav2_is_path_valid_condition_bt_node
      - nav2_initial_pose_received_condition_bt_node
      - nav2_reinitialize_global_localization_service_bt_node
      - nav2_rate_controller_bt_node
      - nav2_distance_controller_bt_node
      - nav2_speed_controller_bt_node
      - nav2_truncate_path_action_bt_node
      - nav2_truncate_path_local_action_bt_node
      - nav2_goal_updater_node_bt_node
      - nav2_recovery_node_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_round_robin_node_bt_node
      - nav2_transform_available_condition_bt_node
      - nav2_time_expired_condition_bt_node
      - nav2_path_expiring_timer_condition
      - nav2_distance_traveled_condition_bt_node
      - nav2_single_trigger_bt_node
      - nav2_is_battery_low_condition_bt_node
      - nav2_navigate_through_poses_action_bt_node
      - nav2_navigate_to_pose_action_bt_node
      # FIX: this is the specific node the log complained about
      - nav2_remove_passed_goals_action_bt_node
      - nav2_planner_selector_bt_node
      - nav2_controller_selector_bt_node
      - nav2_goal_checker_selector_bt_node
      - nav2_controller_cancel_bt_node
      - nav2_path_longer_on_approach_bt_node
      - nav2_wait_cancel_bt_node
      - nav2_spin_cancel_bt_node
      - nav2_back_up_cancel_bt_node
      - nav2_assisted_teleop_cancel_bt_node
      - nav2_drive_on_heading_cancel_bt_node


behavior_server:
  ros__parameters:
    use_sim_time: false

    global_frame: "map"
    robot_base_frame: "base_link"
    odom_topic: "/odom"

    cycle_frequency: 10.0

    behavior_plugins:
      - "spin"
      - "backup"
      - "wait"

    spin:
      plugin: "nav2_behaviors/Spin"

    backup:
      plugin: "nav2_behaviors/BackUp"

    wait:
      plugin: "nav2_behaviors/Wait"


local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false

      global_frame: "odom"
      robot_base_frame: "base_link"

      update_frequency: 5.0
      publish_frequency: 2.0

      rolling_window: true

      width: 5
      height: 5
      resolution: 0.05

      robot_radius: 0.25

      plugins:
        - "obstacle_layer"
        - "inflation_layer"

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"

        observation_sources: "scan"

        scan:
          topic: "/scan"
          data_type: "LaserScan"

          marking: true
          clearing: true

          obstacle_min_range: 0.15
          obstacle_max_range: 12.0

          raytrace_min_range: 0.15
          raytrace_max_range: 12.0

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"

        inflation_radius: 0.35
        cost_scaling_factor: 3.0

      always_send_full_costmap: true


global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false

      global_frame: "map"
      robot_base_frame: "base_link"

      update_frequency: 2.0
      publish_frequency: 1.0

      resolution: 0.05

      track_unknown_space: true

      robot_radius: 0.25

      plugins:
        - "static_layer"
        - "obstacle_layer"
        - "inflation_layer"

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"

        map_subscribe_transient_local: true

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"

        observation_sources: "scan"

        scan:
          topic: "/scan"
          data_type: "LaserScan"

          marking: true
          clearing: true

          obstacle_min_range: 0.15
          obstacle_max_range: 12.0

          raytrace_min_range: 0.15
          raytrace_max_range: 12.0

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"

        inflation_radius: 0.35
        cost_scaling_factor: 3.0

      always_send_full_costmap: true


waypoint_follower:
  ros__parameters:
    use_sim_time: false

    loop_rate: 20
    stop_on_failure: false
